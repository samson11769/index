<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園電視台 - 電子 Log Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMYMOxMBbT0GvSi7h2Bg677opVJS9dYzg",
      authDomain: "campus-studio-25210.firebaseapp.com",
      projectId: "campus-studio-25210",
      storageBucket: "campus-studio-25210.firebasestorage.app",
      messagingSenderId: "107702082369",
      appId: "1:107702082369:web:6a6f8e6318d3d593b95fc0",
      measurementId: "G-LM890QQCL2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const logsRef = collection(db, "logs");
    const provider = new GoogleAuthProvider();

    // ⚠️ 請修改為你學校的 Email Domain (例: school.edu.hk)
    const SCHOOL_DOMAIN = "ndc.edu.hk"; 

    let currentUser = null;
    let allLogs = [];
    let currentTab = 'active'; 
    let selectedDevices = new Set();
    let pendingReturnId = null;
    let pendingBorrowerName = "";
    let isAdmin = false;
    const ADMIN_PASS = "admin888";

    // 元素引用
    const authOverlay = document.getElementById('authOverlay');
    const appContent = document.getElementById('appContent');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmailDisplay = document.getElementById('userEmailDisplay');

    // Google 登入邏輯
    loginBtn.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const email = result.user.email;
        
        // 驗證 Email Domain
        if (!email.endsWith(`@${SCHOOL_DOMAIN}`)) {
          alert(`❌ 存取失敗：必須使用學校 Email (@${SCHOOL_DOMAIN}) 登入！`);
          await signOut(auth);
        }
      } catch (error) {
        alert("登入失敗: " + error.message);
      }
    });

    // 登出
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
      if (user && user.email.endsWith(`@${SCHOOL_DOMAIN}`)) {
        currentUser = user;
        userEmailDisplay.innerText = user.email;
        authOverlay.classList.add('hidden');
        appContent.classList.remove('hidden');
        
        // 自動帶入姓名/班別欄位 (若 Google 有顯示名稱)
        const borrowerInput = document.getElementById('borrower');
        if (user.displayName && !borrowerInput.value) {
          borrowerInput.value = user.displayName;
        }
      } else {
        currentUser = null;
        authOverlay.classList.remove('hidden');
        appContent.classList.add('hidden');
      }
    });

    // Admin 登入切換
    document.getElementById('adminLoginBtn').addEventListener('click', () => {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminStatus').classList.add('hidden');
        document.getElementById('adminLoginBtn').innerText = "🔑 Admin 登入";
        document.getElementById('adminLoginBtn').className = "text-xs bg-slate-800 text-slate-200 px-2.5 py-1 rounded hover:bg-slate-700 transition shrink-0";
        render();
      } else {
        const pass = prompt("請輸入 Super Admin 密碼：");
        if (pass === ADMIN_PASS) {
          isAdmin = true;
          document.getElementById('adminStatus').classList.remove('hidden');
          document.getElementById('adminLoginBtn').innerText = "🚪 登出 Admin";
          document.getElementById('adminLoginBtn').className = "text-xs bg-red-600 text-white px-2.5 py-1 rounded hover:bg-red-700 transition shrink-0";
          render();
        } else if (pass !== null) {
          alert("密碼錯誤！");
        }
      }
    });

    // 動態更新鏡頭選單鎖定狀態
    function updateLensAvailability() {
      const hasInsta = Array.from(selectedDevices).some(d => d.includes("Insta360"));
      const hasSony = Array.from(selectedDevices).some(d => d.includes("Sony") && !d.includes("Insta360"));
      const hasCanon = Array.from(selectedDevices).some(d => d.includes("Canon") || d.includes("70D"));

      document.querySelectorAll('.lens-chip').forEach(chip => {
        const val = chip.getAttribute('data-val');
        const isSonyLens = val.includes("G Master");
        const isCanonLens = val.includes("Canon");

        let disable = false;

        if (hasInsta) {
          disable = true;
        } else if (hasSony && !hasCanon) {
          disable = !isSonyLens;
        } else if (hasCanon && !hasSony) {
          disable = !isCanonLens;
        }

        if (disable) {
          if (selectedDevices.has(val)) {
            selectedDevices.delete(val);
            chip.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
            chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
          }
          chip.disabled = true;
          chip.classList.add('opacity-40', 'cursor-not-allowed');
        } else {
          chip.disabled = false;
          chip.classList.remove('opacity-40', 'cursor-not-allowed');
        }
      });
    }

    // 多選 Tag 點擊
    document.querySelectorAll('.device-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        if (chip.disabled) return;
        const val = chip.getAttribute('data-val');
        if (selectedDevices.has(val)) {
          selectedDevices.delete(val);
          chip.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
          chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
        } else {
          selectedDevices.add(val);
          chip.classList.remove('bg-gray-100', 'text-gray-700', 'border-gray-200');
          chip.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
        }
        updateLensAvailability();
      });
    });

    // SD Card 容量與卡號連動
    const sdCardSelect = document.getElementById('sdCardSelect');
    document.querySelectorAll('input[name="sdSize"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const size = e.target.value;
        sdCardSelect.innerHTML = '<option value="">請選擇卡號</option>';
        sdCardSelect.disabled = false;

        let start = 1, end = 20;
        if (size === '32GB') { start = 1; end = 20; }
        else if (size === '64GB') { start = 21; end = 30; }
        else if (size === '128GB') { start = 31; end = 40; }

        for (let i = start; i <= end; i++) {
          const num = i < 10 ? `0${i}` : `${i}`;
          const code = `SD-${num} (${size})`;
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code;
          sdCardSelect.appendChild(opt);
        }
      });
    });

    // 表單提交
    document.getElementById('logForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (selectedDevices.size === 0) {
        alert("請至少選擇一樣器材！");
        return;
      }

      const sdCardInput = sdCardSelect.value;
      if (!sdCardInput) {
        alert("請選擇 SD Card 容量及卡號！");
        return;
      }

      const isSdCardBorrowed = allLogs.some(log => 
        !log.returned && log.sdCard && log.sdCard.toLowerCase() === sdCardInput.toLowerCase()
      );

      if (isSdCardBorrowed) {
        alert(`❌ SD Card [${sdCardInput}] 目前已被借出，未完成歸還前不能重複借用！`);
        return;
      }

      const activeBorrowedDevices = new Set();
      allLogs.filter(l => !l.returned).forEach(l => {
        l.device.split(', ').forEach(d => activeBorrowedDevices.add(d));
      });

      const conflictDevice = Array.from(selectedDevices).find(d => activeBorrowedDevices.has(d));
      if (conflictDevice) {
        alert(`❌ 器材 [${conflictDevice}] 目前已被其他人借出，無法登記！`);
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerText = "登記中...";

      try {
        await addDoc(logsRef, {
          borrower: document.getElementById('borrower').value.trim(),
          userEmail: currentUser ? currentUser.email : '',
          device: Array.from(selectedDevices).join(', '),
          sdCard: sdCardInput,
          batteryCount: parseInt(document.getElementById('batteryCount').value) || 0,
          hasCharger: document.getElementById('hasCharger').checked,
          hasBag: document.getElementById('hasBag').checked,
          borrowTime: serverTimestamp(),
          returned: false,
          returnTime: null,
          photoProcessed: true
        });

        e.target.reset();
        selectedDevices.clear();
        sdCardSelect.innerHTML = '<option value="">請先選擇 SD 卡容量</option>';
        sdCardSelect.disabled = true;
        document.querySelectorAll('.device-chip').forEach(chip => {
          chip.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
          chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
        });
        updateLensAvailability();

      } catch (error) {
        alert("新增失敗: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "登記借出";
      }
    });

    // 更新器材按鈕狀態
    function updateChipAvailability() {
      const activeBorrowedDevices = new Set();
      allLogs.filter(log => !log.returned).forEach(log => {
        log.device.split(', ').forEach(item => activeBorrowedDevices.add(item));
      });

      document.querySelectorAll('.device-chip').forEach(chip => {
        const val = chip.getAttribute('data-val');
        if (activeBorrowedDevices.has(val)) {
          chip.disabled = true;
          chip.classList.remove('bg-blue-600', 'bg-gray-100', 'text-gray-700', 'border-gray-200', 'text-white');
          chip.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700', 'line-through', 'cursor-not-allowed', 'opacity-50');
          selectedDevices.delete(val);
        } else {
          chip.disabled = false;
          chip.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700', 'line-through', 'cursor-not-allowed', 'opacity-50');
          if (selectedDevices.has(val)) {
            chip.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
          } else {
            chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
          }
        }
      });
      updateLensAvailability();
    }

    // 渲染清單
    function render() {
      const searchInput = document.getElementById('searchInput');
      const keyword = searchInput.value.toLowerCase().trim();
      const logList = document.getElementById('logList');
      logList.innerHTML = '';

      const filtered = allLogs.filter(log => {
        const matchesTab = currentTab === 'active' ? !log.returned : log.returned;
        const matchesSearch = log.borrower.toLowerCase().includes(keyword) || 
                              log.device.toLowerCase().includes(keyword) || 
                              log.sdCard.toLowerCase().includes(keyword);
        return matchesTab && matchesSearch;
      });

      if (filtered.length === 0) {
        logList.innerHTML = `<p class="text-sm text-gray-400 text-center py-6">${currentTab === 'active' ? '目前沒有未還器材 🎉' : '沒有相關歷史紀錄'}</p>`;
        return;
      }

      filtered.forEach(log => {
        const bTime = log.borrowTime ? new Date(log.borrowTime.toDate()).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '剛才';
        const rTime = log.returnTime ? new Date(log.returnTime.toDate()).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
        const isNotProcessed = log.photoProcessed === false;

        const item = document.createElement('div');
        item.className = `p-3 rounded-lg border transition ${log.returned ? (isNotProcessed ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200 opacity-80') : 'bg-blue-50 border-blue-200'}`;
        
        let actionButtons = '';
        if (!log.returned) {
          actionButtons = `<button data-id="${log.id}" data-borrower="${log.borrower}" class="open-return-modal text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded font-medium shadow-sm transition shrink-0 ml-1">歸還</button>`;
          if (isAdmin) {
            actionButtons += `<button data-id="${log.id}" class="open-admin-modal text-xs bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1.5 rounded font-medium shadow-sm transition shrink-0 ml-1">⚡ 強制歸還</button>`;
          }
        } else {
          actionButtons = `<span class="text-xs ${isNotProcessed ? 'bg-red-100 text-red-700 font-bold' : 'bg-gray-200 text-gray-600'} px-2 py-1 rounded shrink-0 ml-1">已還 (${rTime})</span>`;
        }

        item.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="font-bold text-slate-800">${log.borrower}</span>
              <span class="text-xs text-gray-500"> (${bTime})</span>
              ${isNotProcessed ? '<span class="ml-1 inline-block bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">⚠️ 未過相/執相</span>' : ''}
              <p class="text-sm font-semibold text-blue-900 mt-0.5 break-words">${log.device}</p>
            </div>
            <div class="flex items-center">${actionButtons}</div>
          </div>
          <div class="mt-2 text-xs text-gray-600 border-t border-gray-200/60 pt-2 space-y-0.5">
            <p>💾 SD Card: <b class="text-gray-800">${log.sdCard}</b> | 🔋 電池: <b class="text-gray-800">${log.batteryCount} 粒</b></p>
            <p>🎒 配件: ${log.hasCharger ? '⚡火牛 ' : ''}${log.hasBag ? '👜相機袋' : ''}</p>
          </div>
        `;
        logList.appendChild(item);
      });

      // 歸還驗證 Modal 觸發
      document.querySelectorAll('.open-return-modal').forEach(btn => {
        btn.addEventListener('click', (e) => {
          pendingReturnId = e.target.getAttribute('data-id');
          pendingBorrowerName = e.target.getAttribute('data-borrower');
          document.getElementById('verifyBorrowerInput').value = '';
          document.getElementById('confirmReturnCheckbox').checked = false;
          checkReturnValid();
          document.getElementById('returnModal').classList.remove('hidden');
        });
      });

      // Admin 強制歸還 Modal
      document.querySelectorAll('.open-admin-modal').forEach(btn => {
        btn.addEventListener('click', (e) => {
          pendingReturnId = e.target.getAttribute('data-id');
          document.getElementById('adminModal').classList.remove('hidden');
        });
      });
    }

    // 歸還檢查
    function checkReturnValid() {
      const inputName = document.getElementById('verifyBorrowerInput').value.trim();
      const isNameMatched = inputName === pendingBorrowerName;
      const isChecked = document.getElementById('confirmReturnCheckbox').checked;
      document.getElementById('confirmReturnBtn').disabled = !(isNameMatched && isChecked);
    }

    document.getElementById('verifyBorrowerInput').addEventListener('input', checkReturnValid);
    document.getElementById('confirmReturnCheckbox').addEventListener('change', checkReturnValid);

    document.getElementById('cancelReturnBtn').addEventListener('click', () => {
      document.getElementById('returnModal').classList.add('hidden');
      pendingReturnId = null;
    });

    document.getElementById('confirmReturnBtn').addEventListener('click', async () => {
      if (pendingReturnId) {
        await updateDoc(doc(db, "logs", pendingReturnId), {
          returned: true,
          returnTime: serverTimestamp(),
          photoProcessed: true
        });
        document.getElementById('returnModal').classList.add('hidden');
        pendingReturnId = null;
      }
    });

    // Admin 強制歸還
    document.getElementById('cancelAdminBtn').addEventListener('click', () => {
      document.getElementById('adminModal').classList.add('hidden');
      pendingReturnId = null;
    });

    document.getElementById('adminReturnProcessedBtn').addEventListener('click', async () => {
      if (pendingReturnId) {
        await updateDoc(doc(db, "logs", pendingReturnId), {
          returned: true,
          returnTime: serverTimestamp(),
          photoProcessed: true
        });
        document.getElementById('adminModal').classList.add('hidden');
        pendingReturnId = null;
      }
    });

    document.getElementById('adminReturnUnprocessedBtn').addEventListener('click', async () => {
      if (pendingReturnId) {
        await updateDoc(doc(db, "logs", pendingReturnId), {
          returned: true,
          returnTime: serverTimestamp(),
          photoProcessed: false
        });
        document.getElementById('adminModal').classList.add('hidden');
        pendingReturnId = null;
      }
    });

    // 匯出 CSV
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (allLogs.length === 0) {
        alert("目前沒有任何紀錄可供匯出！");
        return;
      }

      let csvContent = "\uFEFF借用人/班別,登入Email,借用器材與鏡頭,SD Card,電池數量,有火牛,有相機袋,借用時間,歸還狀態,過相/執相狀態,歸還時間\n";

      allLogs.forEach(log => {
        const bTime = log.borrowTime ? new Date(log.borrowTime.toDate()).toLocaleString() : '';
        const rTime = log.returnTime ? new Date(log.returnTime.toDate()).toLocaleString() : '';
        const status = log.returned ? "已歸還" : "未歸還";
        const photoStatus = log.photoProcessed === false ? "⚠️ 未過相/執相" : "已過相/執相";
        
        const row = [
          `"${log.borrower || ''}"`,
          `"${log.userEmail || ''}"`,
          `"${log.device || ''}"`,
          `"${log.sdCard || ''}"`,
          `"${log.batteryCount || 0}"`,
          `"${log.hasCharger ? '是' : '否'}"`,
          `"${log.hasBag ? '是' : '否'}"`,
          `"${bTime}"`,
          `"${status}"`,
          `"${photoStatus}"`,
          `"${rTime}"`
        ];
        csvContent += row.join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `TV_Studio_LogBook_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // 監聽 Firebase 資料
    const q = query(logsRef, orderBy("borrowTime", "desc"));
    onSnapshot(q, (snapshot) => {
      allLogs = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      document.getElementById('activeCount').innerText = allLogs.filter(l => !l.returned).length;
      updateChipAvailability();
      render();
    });

    // Tab 切換
    document.getElementById('tabActive').addEventListener('click', () => {
      currentTab = 'active';
      document.getElementById('tabActive').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm";
      document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700";
      render();
    });

    document.getElementById('tabHistory').addEventListener('click', () => {
      currentTab = 'history';
      document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm";
      document.getElementById('tabActive').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700";
      render();
    });

    document.getElementById('searchInput').addEventListener('input', render);
  </script>
</head>
<body class="bg-slate-100 p-4 min-h-screen flex items-center justify-center">

  <!-- 未登入畫面 (登入卡片) -->
  <div id="authOverlay" class="max-w-md w-full bg-white rounded-xl shadow-md p-8 text-center space-y-5">
    <img src="CS_Logo.jpg" alt="Logo" class="h-16 w-auto mx-auto object-contain">
    <div>
      <h2 class="text-xl font-bold text-slate-800">校園電視台 Log Book</h2>
      <p class="text-xs text-slate-500 mt-1">請使用學校 Google Email 帳戶登入以繼續</p>
    </div>
    <button id="loginBtn" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      使用 Google 登入
    </button>
  </div>

  <!-- 已登入主系統 -->
  <div id="appContent" class="hidden max-w-md w-full bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-5">
    
    <header class="border-b pb-3 flex justify-between items-center gap-3">
      <div class="flex items-center gap-2.5">
        <img src="CS_Logo.jpg" alt="Logo" class="h-10 w-auto rounded object-contain">
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-bold text-slate-800 leading-tight">Campus Studio</h1>
            <span id="adminStatus" class="hidden text-[10px] bg-purple-600 text-white font-bold px-1.5 py-0.5 rounded">ADMIN</span>
          </div>
          <p class="text-[11px] text-slate-500 leading-tight" id="userEmailDisplay"></p>
        </div>
      </div>
      <div class="flex gap-1">
        <button id="adminLoginBtn" class="text-xs bg-slate-800 text-slate-200 px-2 py-1 rounded hover:bg-slate-700 transition">🔑 Admin</button>
        <button id="logoutBtn" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300 transition">🚪 登出</button>
      </div>
    </header>

    <!-- 借用表單 -->
    <form id="logForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700">借用人姓名 / 班別 <span class="text-red-500">*</span></label>
        <input type="text" id="borrower" required placeholder="例：3A 張小明" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 多選器材區 -->
      <div class="space-y-3">
        <label class="block text-xs font-semibold text-gray-700">選擇器材及鏡頭（可多選）<span class="text-red-500">*</span></label>
        
        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">📷 相機 / 攝影機</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="Sony A7c" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony A7c</button>
            <button type="button" data-val="Canon R8 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon R8 1</button>
            <button type="button" data-val="Canon R8 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon R8 2</button>
            <button type="button" data-val="Canon M50" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon M50</button>
            <button type="button" data-val="Sony Z90 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z90 1</button>
            <button type="button" data-val="Sony Z90 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z90 2</button>
            <button type="button" data-val="Sony Z150" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z150</button>
            <button type="button" data-val="Canon XA10" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon XA10</button>
            <button type="button" data-val="70D" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">70D</button>
            <button type="button" data-val="XE-1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">XE-1</button>
            <button type="button" data-val="Insta360 X3 / One RS" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Insta360全景相機</button>
          </div>
        </div>

        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">🔍 鏡頭 (Lenses)</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="Canon 24-105" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 24-105</button>
            <button type="button" data-val="Canon 18-200" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 18-200</button>
            <button type="button" data-val="Canon 10-22" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 10-22</button>
            <button type="button" data-val="Canon 50" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 50</button>
            <button type="button" data-val="Canon 35" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 35</button>
            <button type="button" data-val="Canon 24-70mm" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 24-70mm</button>
            <button type="button" data-val="Canon 85mm" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 85mm</button>
            <button type="button" data-val="Canon 70-200mm" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 70-200mm</button>
            <button type="button" data-val="G Master 16-35mm" class="device-chip lens-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">G Master 16-35mm</button>
          </div>
        </div>

        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">🎙️ 麥克風 & 穩定器</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="DJI mic 2 無線麥克風 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">DJI mic 2 #1</button>
            <button type="button" data-val="DJI mic 2 無線麥克風 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">DJI mic 2 #2</button>
            <button type="button" data-val="WIRELESS GO" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">WIRELESS GO</button>
            <button type="button" data-val="DJI 手機穩定器" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">手機穩定器</button>
          </div>
        </div>
      </div>

      <!-- 配件登記區 -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
        <span class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">配件及 SD Card 登記</span>
        
        <div class="space-y-1.5">
          <label class="text-xs font-medium text-gray-700 block">1. 選擇 SD Card 容量 <span class="text-red-500">*</span></label>
          <div class="flex gap-4 bg-white p-2 rounded border border-gray-200 text-xs">
            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="sdSize" value="32GB" class="text-blue-600"> 32GB (SD01-20)</label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="sdSize" value="64GB" class="text-blue-600"> 64GB (SD21-30)</label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="sdSize" value="128GB" class="text-blue-600"> 128GB (SD31-40)</label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-gray-700">2. 卡號 <span class="text-red-500">*</span></label>
            <select id="sdCardSelect" disabled class="w-full border rounded p-1.5 text-xs bg-white mt-0.5 focus:ring-blue-500">
              <option value="">請先選擇 SD 卡容量</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-700">電池數量</label>
            <input type="number" id="batteryCount" value="1" min="0" max="5" class="w-full border rounded p-1.5 text-xs bg-white mt-0.5">
          </div>
        </div>

        <div class="flex gap-4 pt-1">
          <label class="inline-flex items-center">
            <input type="checkbox" id="hasCharger" class="rounded border-gray-300 text-blue-600">
            <span class="ml-1.5 text-xs text-gray-700">連火牛/充電器</span>
          </label>
          <label class="inline-flex items-center">
            <input type="checkbox" id="hasBag" class="rounded border-gray-300 text-blue-600">
            <span class="ml-1.5 text-xs text-gray-700">連相機袋</span>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-md transition text-sm shadow">
        登記借出
      </button>
    </form>

    <!-- 紀錄清單 -->
    <div class="pt-2 border-t space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex-1 flex bg-slate-100 p-1 rounded-lg">
          <button id="tabActive" class="flex-1 py-1 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm">
            未歸還 (<span id="activeCount">0</span>)
          </button>
          <button id="tabHistory" class="flex-1 py-1 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700">
            歷史紀錄
          </button>
        </div>
        
        <button id="exportBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 shrink-0">
          📊 匯出 Excel
        </button>
      </div>

      <input type="text" id="searchInput" placeholder="🔍 搜尋人名 / 器材 / 鏡頭 / SD 卡號..." class="w-full border rounded-md p-2 text-xs bg-slate-50">

      <div id="logList" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1"></div>
    </div>

  </div>

  <!-- 本人歸還驗證 Modal -->
  <div id="returnModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-gray-800 border-b pb-2">🔒 本人歸還確認</h3>
      <div class="space-y-2">
        <label class="block text-xs font-medium text-gray-700">請輸入「借用人姓名/班別」進行身份驗證：</label>
        <input type="text" id="verifyBorrowerInput" placeholder="輸入借用時填寫的姓名" class="w-full border rounded-md p-2 text-xs focus:ring-blue-500 border-gray-300">
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="checkbox" id="confirmReturnCheckbox" class="mt-0.5 rounded border-amber-400 text-blue-600 focus:ring-blue-500">
          <span class="text-xs font-bold text-amber-900 leading-snug">我已確認過相 / 過片及完成執相工作</span>
        </label>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="cancelReturnBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 rounded-lg transition">取消</button>
        <button id="confirmReturnBtn" disabled class="flex-1 bg-green-600 hover:bg-green-700 disabled:bg-gray-300 text-white text-xs font-semibold py-2 rounded-lg transition">確認歸還</button>
      </div>
    </div>
  </div>

  <!-- Admin 強制歸還 Modal -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl border-t-4 border-purple-600">
      <h3 class="text-base font-bold text-purple-900 border-b pb-2">⚡ Super Admin 強制歸還設定</h3>
      <p class="text-xs text-gray-600 leading-relaxed">請選擇此筆器材的歸還狀況：</p>
      <div class="space-y-2 pt-1">
        <button id="adminReturnProcessedBtn" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg transition text-left flex justify-between items-center">
          <span>✅ 正常歸還（已過相 / 執相）</span>
          <span>➔</span>
        </button>
        <button id="adminReturnUnprocessedBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg transition text-left flex justify-between items-center">
          <span>❌ 未執相 / 未過片 (強制收回)</span>
          <span>➔</span>
        </button>
      </div>
      <div class="pt-2">
        <button id="cancelAdminBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 rounded-lg transition">取消</button>
      </div>
    </div>
  </div>

</body>
</html>
