<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園電視台 - 電子 Log Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMYMOxMBbT0GvSi7h2Bg677opVJS9dYzg",
      authDomain: "campus-studio-25210.firebaseapp.com",
      projectId: "campus-studio-25210",
      storageBucket: "campus-studio-25210.firebasestorage.app",
      messagingSenderId: "107702082369",
      appId: "1:107702082369:web:6a6f8e6318d3d593b95fc0",
      measurementId: "G-LM890QQCL2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const logsRef = collection(db, "logs");

    let allLogs = [];
    let currentTab = 'active'; 
    let selectedDevices = new Set();
    let pendingReturnId = null;

    const form = document.getElementById('logForm');
    const logList = document.getElementById('logList');
    const searchInput = document.getElementById('searchInput');
    const returnModal = document.getElementById('returnModal');
    const confirmReturnCheckbox = document.getElementById('confirmReturnCheckbox');
    const confirmReturnBtn = document.getElementById('confirmReturnBtn');

    // 處理多選 Tag 點擊
    document.querySelectorAll('.device-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const val = chip.getAttribute('data-val');
        if (selectedDevices.has(val)) {
          selectedDevices.delete(val);
          chip.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
          chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
        } else {
          selectedDevices.add(val);
          chip.classList.remove('bg-gray-100', 'text-gray-700', 'border-gray-200');
          chip.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
        }
      });
    });

    // 提交借用資料
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (selectedDevices.size === 0) {
        alert("請至少選擇一樣器材或鏡頭！");
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerText = "登記中...";

      const deviceString = Array.from(selectedDevices).join(', ');

      try {
        await addDoc(logsRef, {
          borrower: document.getElementById('borrower').value,
          device: deviceString,
          sdCard: document.getElementById('sdCard').value,
          batteryCount: parseInt(document.getElementById('batteryCount').value) || 0,
          hasCharger: document.getElementById('hasCharger').checked,
          hasBag: document.getElementById('hasBag').checked,
          borrowTime: serverTimestamp(),
          returned: false,
          returnTime: null
        });

        // 重置表單與選取狀態
        form.reset();
        selectedDevices.clear();
        document.querySelectorAll('.device-chip').forEach(chip => {
          chip.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
          chip.classList.add('bg-gray-100', 'text-gray-700', 'border-gray-200');
        });

      } catch (error) {
        alert("新增失敗: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "登記借出";
      }
    });

    // 渲染清單
    function render() {
      const keyword = searchInput.value.toLowerCase().trim();
      logList.innerHTML = '';

      const filtered = allLogs.filter(log => {
        const matchesTab = currentTab === 'active' ? !log.returned : log.returned;
        const matchesSearch = log.borrower.toLowerCase().includes(keyword) || 
                              log.device.toLowerCase().includes(keyword) || 
                              log.sdCard.toLowerCase().includes(keyword);
        return matchesTab && matchesSearch;
      });

      if (filtered.length === 0) {
        logList.innerHTML = `<p class="text-sm text-gray-400 text-center py-6">${currentTab === 'active' ? '目前沒有未還器材 🎉' : '沒有相關歷史紀錄'}</p>`;
        return;
      }

      filtered.forEach(log => {
        const bTime = log.borrowTime ? new Date(log.borrowTime.toDate()).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '剛才';
        const rTime = log.returnTime ? new Date(log.returnTime.toDate()).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

        const item = document.createElement('div');
        item.className = `p-3 rounded-lg border transition ${log.returned ? 'bg-gray-50 border-gray-200 opacity-70' : 'bg-blue-50 border-blue-200'}`;
        item.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="font-bold text-slate-800">${log.borrower}</span>
              <span class="text-xs text-gray-500"> (${bTime})</span>
              <p class="text-sm font-semibold text-blue-900 mt-0.5 break-words">${log.device}</p>
            </div>
            ${!log.returned ? 
              `<button data-id="${log.id}" class="open-return-modal text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded font-medium shadow-sm transition shrink-0 ml-2">歸還</button>` : 
              `<span class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600 shrink-0 ml-2">已還 (${rTime})</span>`
            }
          </div>
          <div class="mt-2 text-xs text-gray-600 border-t border-gray-200/60 pt-2 space-y-0.5">
            <p>💾 SD Card: <b class="text-gray-800">${log.sdCard}</b> | 🔋 電池: <b class="text-gray-800">${log.batteryCount} 粒</b></p>
            <p>🎒 配件: ${log.hasCharger ? '⚡火牛 ' : ''}${log.hasBag ? '👜相機袋' : ''}</p>
          </div>
        `;
        logList.appendChild(item);
      });

      // 點擊歸還按鈕時觸發 Modal
      document.querySelectorAll('.open-return-modal').forEach(btn => {
        btn.addEventListener('click', (e) => {
          pendingReturnId = e.target.getAttribute('data-id');
          confirmReturnCheckbox.checked = false;
          confirmReturnBtn.disabled = true;
          returnModal.classList.remove('hidden');
        });
      });
    }

    // Modal 勾選邏輯
    confirmReturnCheckbox.addEventListener('change', (e) => {
      confirmReturnBtn.disabled = !e.target.checked;
    });

    document.getElementById('cancelReturnBtn').addEventListener('click', () => {
      returnModal.classList.add('hidden');
      pendingReturnId = null;
    });

    confirmReturnBtn.addEventListener('click', async () => {
      if (pendingReturnId) {
        await updateDoc(doc(db, "logs", pendingReturnId), {
          returned: true,
          returnTime: serverTimestamp()
        });
        returnModal.classList.add('hidden');
        pendingReturnId = null;
      }
    });

    // 匯出 CSV 報表
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (allLogs.length === 0) {
        alert("目前沒有任何紀錄可供匯出！");
        return;
      }

      let csvContent = "\uFEFF借用人/班別,借用器材與鏡頭,SD Card,電池數量,有火牛,有相機袋,借用時間,歸還狀態,歸還時間\n";

      allLogs.forEach(log => {
        const bTime = log.borrowTime ? new Date(log.borrowTime.toDate()).toLocaleString() : '';
        const rTime = log.returnTime ? new Date(log.returnTime.toDate()).toLocaleString() : '';
        const status = log.returned ? "已歸還" : "未歸還";
        
        const row = [
          `"${log.borrower || ''}"`,
          `"${log.device || ''}"`,
          `"${log.sdCard || ''}"`,
          `"${log.batteryCount || 0}"`,
          `"${log.hasCharger ? '是' : '否'}"`,
          `"${log.hasBag ? '是' : '否'}"`,
          `"${bTime}"`,
          `"${status}"`,
          `"${rTime}"`
        ];
        csvContent += row.join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      const today = new Date().toISOString().slice(0, 10);
      link.setAttribute("href", url);
      link.setAttribute("download", `TV_Studio_LogBook_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // 監聽 Firebase 資料
    const q = query(logsRef, orderBy("borrowTime", "desc"));
    onSnapshot(q, (snapshot) => {
      allLogs = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
      const activeCount = allLogs.filter(l => !l.returned).length;
      document.getElementById('activeCount').innerText = activeCount;
      render();
    });

    // Tab 切換事件
    document.getElementById('tabActive').addEventListener('click', () => {
      currentTab = 'active';
      document.getElementById('tabActive').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm";
      document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700";
      render();
    });

    document.getElementById('tabHistory').addEventListener('click', () => {
      currentTab = 'history';
      document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm";
      document.getElementById('tabActive').className = "flex-1 py-1.5 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700";
      render();
    });

    searchInput.addEventListener('input', render);
  </script>
</head>
<body class="bg-slate-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-5">
    
    <header class="border-b pb-3 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-800">📺 Campus Studio Log Book</h1>
        <p class="text-xs text-slate-500">雲端即時器材借用系統</p>
      </div>
      <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">
        ● 即時連線
      </span>
    </header>

    <!-- 借用表單 -->
    <form id="logForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700">借用人姓名 / 班別 <span class="text-red-500">*</span></label>
        <input type="text" id="borrower" required placeholder="例：3A 張小明" class="mt-1 w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 多選器材區 -->
      <div class="space-y-3">
        <label class="block text-xs font-semibold text-gray-700">選擇器材及鏡頭（可多選）<span class="text-red-500">*</span></label>
        
        <!-- 相機 -->
        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">📷 相機 / 攝影機</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="Sony A7c" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony A7c</button>
            <button type="button" data-val="Canon R8 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon R8 1</button>
            <button type="button" data-val="Canon R8 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon R8 2</button>
            <button type="button" data-val="Canon M50" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon M50</button>
            <button type="button" data-val="Sony Z90 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z90 1</button>
            <button type="button" data-val="Sony Z90 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z90 2</button>
            <button type="button" data-val="Sony Z150" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Sony Z150</button>
            <button type="button" data-val="Canon XA10" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon XA10</button>
            <button type="button" data-val="70D" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">70D</button>
            <button type="button" data-val="XE-1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">XE-1</button>
          </div>
        </div>

        <!-- 鏡頭 -->
        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">🔍 鏡頭 (Lenses)</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="Canon 24-105" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 24-105</button>
            <button type="button" data-val="Canon 18-200" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 18-200</button>
            <button type="button" data-val="Canon 10-22" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 10-22</button>
            <button type="button" data-val="Canon 50" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 50</button>
            <button type="button" data-val="Canon 35" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 35</button>
            <button type="button" data-val="Canon 24-70mm" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 24-70mm</button>
            <button type="button" data-val="Canon 85mm" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 85mm</button>
            <button type="button" data-val="Canon 70-200mm" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">Canon 70-200mm</button>
            <button type="button" data-val="G Master 16-35mm" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">G Master 16-35mm</button>
          </div>
        </div>

        <!-- 麥克風 -->
        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">🎙️ 麥克風</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="DJI mic 2 無線麥克風 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">DJI mic 2 #1</button>
            <button type="button" data-val="DJI mic 2 無線麥克風 2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">DJI mic 2 #2</button>
            <button type="button" data-val="DJI mic 3 無線麥克風 1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">DJI mic 3 #1</button>
            <button type="button" data-val="WIRELESS GO 無線麥克風" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">WIRELESS GO</button>
          </div>
        </div>

        <!-- 穩定器 -->
        <div>
          <span class="text-[11px] font-bold text-gray-400 uppercase">📱 手機穩定器</span>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button type="button" data-val="DJI 手機穩定器1" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">穩定器 1</button>
            <button type="button" data-val="DJI 手機穩定器2" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">穩定器 2</button>
            <button type="button" data-val="DJI 手機穩定器3" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">穩定器 3</button>
            <button type="button" data-val="DJI 手機穩定器4" class="device-chip text-xs px-2.5 py-1 rounded-full border border-gray-200 bg-gray-100 text-gray-700 transition">穩定器 4</button>
          </div>
        </div>
      </div>

      <!-- 配件登記區 -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
        <span class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">配件登記</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-gray-700">SD Card 編號 <span class="text-red-500">*</span></label>
            <input type="text" id="sdCard" required placeholder="例: SD-01" class="w-full border rounded p-1.5 text-sm bg-white mt-0.5 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-700">電池數量</label>
            <input type="number" id="batteryCount" value="1" min="0" max="5" class="w-full border rounded p-1.5 text-sm bg-white mt-0.5">
          </div>
        </div>

        <div class="flex gap-4 pt-1">
          <label class="inline-flex items-center">
            <input type="checkbox" id="hasCharger" class="rounded border-gray-300 text-blue-600">
            <span class="ml-1.5 text-xs text-gray-700">連火牛/充電器</span>
          </label>
          <label class="inline-flex items-center">
            <input type="checkbox" id="hasBag" class="rounded border-gray-300 text-blue-600" checked>
            <span class="ml-1.5 text-xs text-gray-700">連相機袋</span>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-md transition text-sm shadow">
        登記借出
      </button>
    </form>

    <!-- 紀錄清單區塊 -->
    <div class="pt-2 border-t space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex-1 flex bg-slate-100 p-1 rounded-lg">
          <button id="tabActive" class="flex-1 py-1 text-xs font-bold text-center rounded-md bg-white text-blue-600 shadow-sm">
            未歸還 (<span id="activeCount">0</span>)
          </button>
          <button id="tabHistory" class="flex-1 py-1 text-xs font-bold text-center rounded-md text-gray-500 hover:text-gray-700">
            歷史紀錄
          </button>
        </div>
        
        <button id="exportBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 shrink-0">
          📊 匯出 Excel
        </button>
      </div>

      <input type="text" id="searchInput" placeholder="🔍 搜尋人名 / 器材 / 鏡頭 / SD 卡號..." class="w-full border rounded-md p-2 text-xs bg-slate-50">

      <div id="logList" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1">
      </div>
    </div>

  </div>

  <!-- 歸還確認 Modal 彈窗 -->
  <div id="returnModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-gray-800 border-b pb-2">⚠️ 歸還器材確認</h3>
      <p class="text-xs text-gray-600 leading-relaxed">請確保已完成以下整理工作才進行歸還程序：</p>
      
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="checkbox" id="confirmReturnCheckbox" class="mt-0.5 rounded border-amber-400 text-blue-600 focus:ring-blue-500">
          <span class="text-xs font-bold text-amber-900 leading-snug">我已確認過相 / 過片及完成執相工作</span>
        </label>
      </div>

      <div class="flex gap-2 pt-2">
        <button id="cancelReturnBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 rounded-lg transition">
          取消
        </button>
        <button id="confirmReturnBtn" disabled class="flex-1 bg-green-600 hover:bg-green-700 disabled:bg-gray-300 text-white text-xs font-semibold py-2 rounded-lg transition">
          確認歸還
        </button>
      </div>
    </div>
  </div>
</body>
</html>
